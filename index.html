<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <meta name="description" content="전공별 2,000 학술 영어 어휘와 출석 달력, 체스 랭크 챌린지를 갖춘 Word Garden">
  <title>Word Garden · 전공별 영어 단어 마스터</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=6">
  <link rel="stylesheet" href="./garden.css?v=5">
  <script type="module" src="./app.js?v=6"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <div class="app-shell">
    <header id="header" class="app-header"></header>
    <div id="connection" class="connection" role="status" hidden></div>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <span>WORD GARDEN · 8 MAJORS · 2,000 WORDS</span>
      <span>체스 랭크와 함께 성장하는 나만의 영단어 정원 ♟️🌱</span>
    </footer>
  </div>

  <!-- Persistent Bottom App Navigation -->
  <nav id="bottom-nav" class="bottom-nav" aria-label="하단 탭 메뉴">
    <button class="nav-tab active" data-action="nav-home" aria-label="홈 탭">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">홈</span>
    </button>
    <button class="nav-tab" data-action="nav-majors" aria-label="전공 단어장 탭">
      <span class="nav-icon">🎓</span>
      <span class="nav-label">전공단어</span>
    </button>
    <button class="nav-tab" data-action="nav-quiz" aria-label="단어 퀴즈 탭">
      <span class="nav-icon">⚡</span>
      <span class="nav-label">단어 배틀 체스</span>
    </button>
    <button class="nav-tab" data-action="nav-review" aria-label="복습 노트 탭">
      <span class="nav-icon">🔁</span>
      <span class="nav-label">복습/즐겨찾기</span>
      <span id="nav-review-badge" class="nav-badge" hidden>0</span>
    </button>
    <button class="nav-tab" data-action="nav-settings" aria-label="설정 탭">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">설정</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Settings Dialog -->
  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog"><button class="icon-button close-dialog" aria-label="닫기">✕</button></form>
    <span class="eyebrow">WORD GARDEN · DATA & SYNC</span>
    <h2 id="settings-title">학습 기록 및 오프라인 보관소</h2>
    <p class="muted">학습 기록은 기기 브라우저에 안전하게 저장돼요. 네트워크 연결이 없어도 학습을 이어갈 수 있습니다.</p>
    <div id="storage-info"></div>
    <div class="dialog-actions">
      <button class="button primary full" id="export-records">학습 기록 백업 내려받기 (.json) ↓</button>
      <button class="button subtle full" id="sync-records">클라우드 동기화 확인</button>
      <button class="button subtle full" id="reset-study-btn" style="color:#ef4444;">학습 기록 초기화</button>
    </div>
    <p class="fine-print" id="sync-description"></p>
  </dialog>
  <noscript>Word Garden을 이용하려면 브라우저의 JavaScript를 켜 주세요.</noscript>
</body>
</html>
